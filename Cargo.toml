[package]
name = "hyperkb"
version = "0.1.7"
edition = "2024"
authors = ["HyperModo"]
description = "Fast, resource-efficient local developer knowledge and proactive risk prevention engine"

[lib]
name = "hyperkb"
path = "src/lib.rs"

[[bin]]
name = "hyperkb"
path = "src/main.rs"

[dependencies]
# 1. Database & FTS5 (Statically compiled SQLite + FTS5, zero CGO/external lib requirements)
rusqlite = { version = "0.33", features = ["bundled"] }

# 2. Distributed Identity & Serialization
uuid = { version = "1.10", features = ["v7", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# 3. CLI Parsing (Minimal features to keep compile time & binary lean)
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage"] }

# 4. Terminal UI & Styling
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false }

# 5. Cryptography & Hashing
sha2 = "0.10"
hex = "0.4"

# 6. Diffing
similar = { version = "2.6", default-features = false, features = ["text"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
